server:
  port: ${SERVER_HTTP_PORT:8082}
  servlet:
    context-path: /

spring:
  application:
    name: statistiloto-server

  profiles:
    active: ${SERVER_PROFILE:dev}

  # ── Database (app schema in shared Postgres) ───────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:statistiloto}?currentSchema=app
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc.lob.non_contextual_creation: true

  flyway:
    enabled: true
    schemas: app
    default-schema: app
    locations: classpath:db/migration

  # ── Security: OAuth2 Resource Server (Keycloak JWT) ────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWK set URI — Spring fetches public keys from Keycloak to
          # validate JWT signatures. Using jwk-set-uri instead of
          # issuer-uri avoids issuer mismatch issues when the internal
          # container URL differs from the public URL.
          jwk-set-uri: ${KEYCLOAK_JWKS_URL:http://auth:8080/auth/realms/statistiloto/protocol/openid-connect/certs}
          # Audience validation — the Keycloak realm includes an
          # oidc-audience-mapper on the statistiloto-ui client that
          # adds "statistiloto-ui" to the aud claim of every access token.
          audiences:
            - statistiloto-ui

# ── gRPC client to the Go lottery-stats-server ────────────────────
lottery:
  grpc:
    host: ${LOTTERY_GRPC_HOST:localhost}
    port: ${LOTTERY_GRPC_PORT:9090}

# ── Actuator ──────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ── OpenAPI ───────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.statistiloto: INFO
    org.springframework.security: INFO
